// Retakes-inställningar för [Gamla Skolan]. Körs av RetakesPlugin vid varje karta.
// Samma som pluginets standard, men med bottar så att det går att spela även när få är inne.

// Bottar: fyller upp till 6 spelare totalt (människor + bottar), bara när någon riktig spelare är inne.
bot_quota 6
bot_quota_mode fill
bot_join_after_player 1

// Låt bli (krävs av retakes):
mp_autoteambalance 0
mp_forcecamera 1
mp_give_player_c4 0
mp_halftime 0
mp_ignore_round_win_conditions 0
mp_join_grace_time 0
mp_match_can_clinch 0
mp_maxmoney 0
mp_playercashawards 0
mp_respawn_on_death_ct 0
mp_respawn_on_death_t 0
mp_solid_teammates 1
mp_teamcashawards 0
mp_warmup_pausetimer 0
sv_skirmish_id 0

// Går att ändra:
mp_roundtime_defuse 1.25
mp_autokick 0
mp_c4timer 40
mp_freezetime 1
mp_friendlyfire 0
mp_round_restart_delay 2
sv_talk_enemy_dead 0
sv_talk_enemy_living 0
sv_deadtalk 1
spec_replay_enable 0
mp_maxrounds 30
mp_match_end_restart 0
mp_timelimit 0
mp_match_restart_delay 10
mp_death_drop_gun 1
mp_death_drop_defuser 1
mp_death_drop_grenade 1
mp_warmuptime 15

echo [Retakes] Gamla Skolan-config laddad!
