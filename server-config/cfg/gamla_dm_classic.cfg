// Gamla Skolan - Classic Deathmatch
// Körs vid serverstart i DM-läget och av GamlaSkolanMvp vid varje ny karta.
// Matchen avslutas av GamlaSkolanMvp när någon når kill-gränsen (50) - inte av tiden.

mp_timelimit 0                  // ingen tidsgräns, först till 50 kills vinner
mp_roundtime 60                 // en lång runda (max 60 min) som reserv
mp_maxrounds 0
mp_ignore_round_win_conditions 0
mp_warmuptime 10
mp_match_end_changelevel 1      // byt karta efter matchresultatet
mp_match_end_restart 0
mp_endmatch_votenextmap 0       // GamlaSkolanLage sköter omröstningen
mp_match_restart_delay 15
